function startRun(){
  var q=[],i;
  if(S.level==='whole'){LEVELS.forEach(function(l){q.push({level:l,kind:LV[l].whole||LV[l].run[0]});});}
  else LV[S.level].run.forEach(function(k){q.push({level:S.level,kind:k});});
  run={queue:q,idx:0,score:0,shots:0,hits:0,combo:0,byType:{},ctxs:{},whole:S.level==='whole'};
  $('rack').classList.add('locked');
  newProblem();
}
function newProblem(){
  var e=run.queue[run.idx],ctx=run.ctxs[e.level]||(run.ctxs[e.level]={used:[],seen:stats.seen});
  var p=GAME.make(e.level,e.kind,ctx);
  if(p.qid){ctx.used.push(p.qid);stats.seen[p.qid]=1;}
  run.p=p;run.si=0;run.lock=false;
  run.b=p.stages.map(function(st){return st.k==='formula'?[]:null;});
  S.phase='play';
  renderTop();enterStage();
}
function curStage(){return run.p.stages[run.si];}
function stageItems(st){
  var items=[],i;
  if(st.k==='formula'){
    st.seq.forEach(function(l){items.push({label:l,plaque:true});});
    st.decoy.forEach(function(l){items.push({label:l,plaque:true,msg:'That piece is not part of this formula.'});});
  }else if(st.k==='choice'){
    items.push({label:st.ans,plaque:true,ok:true});
    st.decoys.forEach(function(d){var o=typeof d==='string'?{l:d}:d;items.push({label:o.l,plaque:true,ok:false,msg:o.msg||'Not that one. Read the question again.'});});
  }else{
    items.push({label:fmt(st.ans),val:st.ans,ok:true,msg:''});
    pickDecoys(st.ans,st.traps,5,st.unit).forEach(function(d){items.push({label:fmt(d.v),val:d.v,ok:false,msg:d.msg});});
  }
  return items;
}
function enterStage(){
  var st=curStage();
  if(!st){clearProblem();return;}
  if(st.k==='formula')say('Build <b>'+st.row.replace(/=\s*$/,'')+'</b>: shoot the pieces in order.','');
  else if(st.k==='choice')say('Shoot the right answer.','');
  else say('Shoot the value of <b>'+st.row.replace(/=\s*$/,'')+'</b>.','');
  spawn(stageItems(st),false);renderBench();renderScore();
}
function shoot(t,ev){
  if(!run||S.phase!=='play'||run.lock)return;
  var si=run.si,st=curStage(),p=run.p,ok=false,msg='',pts=0,done=false;
  if(st.k==='formula'){
    var bf=run.b[si],exp=st.seq[bf.length];
    if(t.it.label===exp){ok=true;pts=st.pts;bf.push(exp);done=bf.length===st.seq.length;}
    else msg=st.seq.indexOf(t.it.label)>=0?'Right piece, wrong place. Think about the order.':'That piece is not part of this formula.';
  }else{
    if(t.it.ok){ok=true;pts=st.pts;run.b[si]=true;done=true;}else msg=t.it.msg;
  }
  addHole(t,ev);
  var ws=wstat(p.type);ws.shots++;run.shots++;
  var bt=run.byType[p.type]||(run.byType[p.type]={shots:0,hits:0});bt.shots++;
  if(ok){
    ws.hits++;run.hits++;bt.hits++;run.combo++;
    run.score+=pts*(S.wall?1:2);
    removeTarget(t);
    say(done?'Good. Next.':'Good. Keep going.','good');
    if(done){run.si++;run.lock=true;setTimeout(function(){if(run&&S.phase==='play'){run.lock=false;enterStage();}},260);}else{renderBench();}
  }else{
    run.combo=0;t.el.classList.add('bad');setTimeout(function(){t.el.classList.remove('bad');},320);
    say(msg,'bad');
  }
  renderScore();saveStats();
}
function hint(){
  if(!run||S.phase!=='play'||run.lock)return;
  var st=curStage();
  run.score=Math.max(0,run.score-3);
  if(st.k==='formula'){
    var exp=st.seq[run.b[run.si].length];
    TG.list.forEach(function(t){if(t.it.label===exp)t.el.classList.add('hint');});
    say('Hint: shoot the highlighted piece next.'+(st.hint?' '+st.hint:''),'');
  }else say('Hint: '+(st.hint||st.why||'Work it out on paper, then shoot.'),'');
  renderScore();
}
function clearProblem(){S.phase='clear';clearTargets();spawn([],true);renderTop();}
function nextProblem(){run.idx++;if(run.idx>=run.queue.length){finishRun();}else{newProblem();}}
function skipProblem(){if(S.phase==='play'){run.combo=0;nextProblem();}}
function nextLevelOf(t){var i=LEVELS.indexOf(t);return i>=0&&i<LEVELS.length-1?LEVELS[i+1]:null;}
function finishRun(){
  S.phase='end';
  if(run.score>stats.best)stats.best=run.score;
  Object.keys(run.byType).forEach(function(k){var r=run.byType[k];if(r.shots&&r.hits/r.shots>=0.7)stats.cleared[k]=true;});
  saveStats();clearTargets();
  $('rack').classList.remove('locked');
  renderRack();renderBest();renderTop();
}
function quitRun(){
  run=null;S.phase='idle';$('rack').classList.remove('locked');
  renderTop();idleTargets();
}
function idleTargets(){
  var lv=S.level==='whole'?LEVELS[0]:S.level,p=GAME.make(lv,LV[lv].run[0],{used:[],seen:{}}),items=stageItems(p.stages[0]).map(function(i){return {label:i.label,plaque:i.plaque};});
  spawn(items,true);
}

/* ---------- rendering ---------- */
function renderBest(){$('best').textContent=stats.best?'Best run: '+stats.best+' points':'';}
function renderRack(){
  var h='';
  LEVELS.concat(['whole']).forEach(function(k,i){
    var w=LV[k],dis=(k==='whole'&&S.screen!=='range'),num=k==='whole'?'★':String(i+1);
    h+='<button type="button" class="wp" data-w="'+k+'" aria-pressed="'+(S.level===k)+'"'+(dis?' disabled':'')+'><span class="wn"><span class="num">'+num+'</span>'+w.name+'</span><span class="wo">'+(w.sub||'')+(stats.cleared[k]?' ✓':'')+'</span></button>';
  });
  $('rack').innerHTML=h;
}
function renderTabs(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-selected',String(b.getAttribute('data-s')===S.screen));});
  ['armory','trainer','range'].forEach(function(s){$('s-'+s).hidden=(s!==S.screen);});
}
function wallBox(t,full){var W=LV[t];return '<p class="wlab">Wall · '+W.name+(W.slides?' · slides '+W.slides:'')+'</p>'+GAME.wall(t,full);}
function renderArmory(){
  var t=S.level;
  $('wall-big').innerHTML=wallBox(t,true);
  var s=wstat(t);
  $('a-acc').textContent=s.shots?'Accuracy on '+LV[t].name+': '+Math.round(100*s.hits/s.shots)+'% over '+s.shots+' shots.':'No shots yet on '+LV[t].name+'.';
}
function renderTrainer(){
  var L=GAME.lesson[S.level],i=S.lesson,step=L[i];
  $('t-say').innerHTML=step.say;$('t-show').innerHTML=step.show;
  if(step.init)step.init($('t-show'));
  $('t-count').textContent=LV[S.level].name+' lesson · '+(i+1)+' of '+L.length;
  $('t-prev').disabled=(i===0);
  $('t-next').textContent=i===L.length-1?'Go to the range':'Next';
}
function renderScore(){
  var el=$('r-score');if(!el||!run)return;
  el.textContent='Score '+run.score+' · combo '+run.combo+' · shots '+run.hits+'/'+run.shots;
}
function renderBench(){
  var el=$('bench');if(!el||!run)return;
  var p=run.p,h='',lastG;
  if(p.given)h+='<div class="givenbox"><span>'+p.given+'</span></div>';
  p.stages.forEach(function(st,i){
    var ready=i<=run.si,done=i<run.si,isCur=i===run.si;
    if(st.group!==lastG){if(st.group)h+='<div class="bgroup">'+st.group+'</div>';lastG=st.group;}
    if(st.ctx&&ready)h+='<div class="bctx">'+st.ctx+'</div>';
    h+='<div class="eqrow"><span class="lhs">'+st.row+'</span>';
    if(st.k==='formula'){
      var cur=run.b[i]||[];
      st.seq.forEach(function(tok,j){
        var filled=j<cur.length,on=isCur&&j===cur.length;
        h+='<span class="slot'+(filled?' filled':'')+(on?' on':'')+'">'+(filled?cur[j]:'')+'</span>';
      });
    }else{
      if(st.working&&ready)h+='<span class="given">'+st.working+' =</span>';
      var val=done?(st.k==='choice'?st.ans:fmt(st.ans)):'?';
      h+='<span class="slot'+(done?' filled':'')+(isCur?' on':'')+'"'+(st.k==='choice'?' style="min-width:160px"':'')+'>'+val+'</span>';
    }
    h+='</div>';
  });
  el.innerHTML=h;
}
function solutionHTML(p){
  var h='<div class="sol">',lastG;
  if(p.given)h+='<div class="givenbox" style="margin:0 0 8px"><span>'+p.given+'</span></div>';
  p.stages.forEach(function(st){
    if(st.group!==lastG){if(st.group)h+='<div class="bgroup" style="margin-top:6px">'+st.group+'</div>';lastG=st.group;}
    h+=st.row+' '+(st.k==='formula'?st.seq.join(' '):st.k==='choice'?'<b>'+st.ans+'</b>':'<b>'+fmt(st.ans)+'</b>')+'<br>';
  });
  if(p.note)h+='<div class="note">'+p.note+'</div>';
  return h+'</div>';
}
function setupHTML(){
  var wk=S.level,W=LV[wk],isW=wk==='whole';
  var total=isW?LEVELS.length:W.run.length;
  var intro=isW?'One problem from each of the '+LEVELS.length+' levels, in chapter order.':(W.intro||'Shoot the right answers as they cross the range. Every wrong shot gets a reason from the coach.');
  var h='<h2>'+W.name+(W.slides?' · slides '+W.slides:'')+'</h2><p class="muted" style="margin:0 0 6px">'+intro+'</p>';
  if(!isW&&W.runLabel)h+='<p class="muted small" style="margin:0 0 8px">This run: '+W.runLabel+'</p>';
  h+='<div class="check"><input type="checkbox" id="wallchk"'+(S.wall?' checked':'')+'><label for="wallchk">Wall visible (cover it for double points)</label></div>'+
  '<div class="actions" style="margin-top:0"><button type="button" class="btn primary" id="go">Start run</button><span class="muted">'+total+' problems</span></div>';
  return h;
}
function renderTop(){
  var top=$('r-top'),bot=$('r-bottom');
  if(S.phase==='idle'){
    var wt=S.level==='whole'?LEVELS[0]:S.level;
    top.innerHTML=setupHTML();bot.innerHTML='<div class="wall wallmini">'+wallBox(wt,false)+'</div>';return;
  }
  if(S.phase==='play'){
    var p=run.p;
    top.innerHTML='<div class="missionbar"><p class="mission">'+p.statement+'</p><p class="score" id="r-score"></p></div><p class="score" style="margin:2px 0 0">Problem '+(run.idx+1)+' of '+run.queue.length+' · '+LV[p.type].name+'</p><div class="bench" id="bench"></div><p class="coachline" id="coach" aria-live="polite"></p><div class="actions" style="margin-top:0"><button type="button" class="btn" id="hintb">Ask the coach (-3)</button><button type="button" class="btn" id="skipb">Skip</button><button type="button" class="btn" id="quitb">Quit run</button></div>';
    bot.innerHTML=S.wall?'<div class="wall wallmini">'+wallBox(p.type,false)+'</div>':'<p class="muted wallmini">Wall covered. Double points.</p>';
    renderBench();renderScore();return;
  }
  if(S.phase==='clear'){
    var last=run.idx>=run.queue.length-1;
    top.innerHTML='<h2>Cleared</h2><p style="margin:0 0 8px">'+run.p.statement+'</p>'+solutionHTML(run.p)+'<div class="actions"><button type="button" class="btn primary" id="nextb">'+(last?'See results':'Next problem')+'</button><span class="muted">Score '+run.score+'</span></div>';
    bot.innerHTML='';return;
  }
  if(S.phase==='end'){
    var acc=run.shots?Math.round(100*run.hits/run.shots):0,rows='',worst=null,wa=101;
    LEVELS.forEach(function(k){
      var r=run.byType[k];if(!r)return;
      var a=Math.round(100*r.hits/r.shots);
      rows+='<li><span>'+LV[k].name+(LV[k].slides?' · slides '+LV[k].slides:'')+'</span><span>'+a+'% ('+r.hits+'/'+r.shots+')'+(stats.cleared[k]?' ✓':'')+'</span></li>';
      if(a<wa){wa=a;worst=k;}
    });
    var nxt=run.whole?null:nextLevelOf(S.level);
    top.innerHTML='<h2>Run complete</h2><p style="margin:0">Score <b>'+run.score+'</b> · accuracy <b>'+acc+'%</b> ('+run.hits+' of '+run.shots+' shots)</p><p class="muted" style="margin:2px 0 0">A level gets a tick when accuracy reaches 70%.</p><ul class="sumlist">'+rows+'</ul>'+
      (worst&&wa<100?'<p>Weakest level: <b>'+LV[worst].name+'</b>. Go back to its lesson, then shoot it again.</p>':'<p>Clean run.</p>')+
      '<div class="actions"><button type="button" class="btn primary" id="again">Run again</button>'+(worst&&wa<100?'<button type="button" class="btn" id="tweak" data-w="'+worst+'">Train '+LV[worst].name+'</button>':'')+(nxt?'<button type="button" class="btn" id="nextlv" data-w="'+nxt+'">Next level: '+LV[nxt].name+'</button>':'')+'</div>';
    bot.innerHTML='';
  }
}
function render(){renderRack();renderTabs();renderBest();if(S.screen==='armory')renderArmory();if(S.screen==='trainer')renderTrainer();if(S.screen==='range'){renderTop();if(S.phase==='idle')idleTargets();}}
function go(s){
  if(S.phase==='play'&&s!=='range'){quitRun();}
  S.screen=s;
  if(s!=='range'&&S.level==='whole')S.level=S.last;
  if(s==='trainer')S.lesson=0;
  if(s==='range'&&(S.phase==='clear'||S.phase==='end')){S.phase='idle';run=null;$('rack').classList.remove('locked');}
  render();
}
function setLevel(k){
  if(S.phase==='play')return;
  S.level=k;if(k!=='whole')S.last=k;S.lesson=0;
  if(S.phase==='clear'||S.phase==='end'){S.phase='idle';run=null;}
  render();
}
function openLevel(k,screen){S.phase='idle';run=null;$('rack').classList.remove('locked');S.level=k;S.last=k;S.lesson=0;go(screen);}

/* ---------- events ---------- */
$('title').textContent=GAME.title;$('tag').innerHTML=GAME.tag;$('foot').innerHTML=GAME.foot;
$('rack').addEventListener('click',function(e){var b=e.target.closest('.wp');if(b&&!b.disabled)setLevel(b.getAttribute('data-w'));});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)go(b.getAttribute('data-s'));});
$('a-train').addEventListener('click',function(){go('trainer');});
$('a-range').addEventListener('click',function(){go('range');});
$('t-prev').addEventListener('click',function(){if(S.lesson>0){S.lesson--;renderTrainer();}});
$('t-next').addEventListener('click',function(){var L=GAME.lesson[S.level];if(S.lesson<L.length-1){S.lesson++;renderTrainer();}else go('range');});
$('r-top').addEventListener('click',function(e){
  var id=e.target.id;
  if(id==='go')startRun();
  else if(id==='hintb')hint();
  else if(id==='skipb')skipProblem();
  else if(id==='quitb')quitRun();
  else if(id==='nextb')nextProblem();
  else if(id==='again'){S.phase='idle';run=null;startRun();}
  else if(id==='tweak')openLevel(e.target.getAttribute('data-w'),'trainer');
  else if(id==='nextlv')openLevel(e.target.getAttribute('data-w'),'trainer');
});
$('r-top').addEventListener('change',function(e){
  if(e.target.id==='wallchk'){S.wall=e.target.checked;renderTop();}
});
window.addEventListener('resize',function(){if(S.screen==='range'&&S.phase==='idle')idleTargets();});
render();

})();
</script>
